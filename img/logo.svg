<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </radialGradient>

    <!-- Yellow Glow & Gradients -->
    <linearGradient id="yellowPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE500" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <linearGradient id="yellowBright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#FFFBEB" />
    </linearGradient>

    <linearGradient id="yellowDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE500" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="highGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur1" />
      <feGaussianBlur stdDeviation="30" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Circuit Pattern -->
    <pattern id="circuitPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 10 10 L 20 20 L 40 20 M 0 30 L 15 30 L 25 40" fill="none" stroke="#F59E0B" stroke-width="1" opacity="0.15" />
      <circle cx="20" cy="20" r="2" fill="#F59E0B" opacity="0.2" />
      <circle cx="10" cy="10" r="1.5" fill="#F59E0B" opacity="0.2" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="800" fill="url(#bgGrad)" />
  <rect width="800" height="800" fill="url(#circuitPattern)" />

  <!-- Outer Tech Ring / Frame -->
  <g opacity="0.9">
    <!-- Outer Glow Ring -->
    <circle cx="400" cy="400" r="340" fill="none" stroke="url(#yellowPrimary)" stroke-width="3" stroke-dasharray="100 20 40 20 200 40" filter="url(#glow)" />
    <circle cx="400" cy="400" r="325" fill="none" stroke="#FBBF24" stroke-width="1" stroke-dasharray="8 8" opacity="0.6" />
    
    <!-- Decorative Tech Nodes on Frame -->
    <circle cx="725" cy="400" r="5" fill="#FFE500" filter="url(#glow)" />
    <circle cx="75" cy="400" r="5" fill="#FFE500" filter="url(#glow)" />
    <circle cx="400" cy="75" r="5" fill="#FFE500" filter="url(#glow)" />
    
    <!-- Rotating Tech Arcs -->
    <path d="M 200 150 A 300 300 0 0 1 600 150" fill="none" stroke="url(#yellowPrimary)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 650 500 A 300 300 0 0 1 500 650" fill="none" stroke="#D97706" stroke-width="6" stroke-linecap="round" />
    <path d="M 150 520 A 300 300 0 0 1 270 650" fill="none" stroke="#FFE500" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Creative Background Rays / Burst behind Ape -->
  <g opacity="0.25">
    <path d="M400 400 L300 100 L500 100 Z" fill="url(#yellowPrimary)" />
    <path d="M400 400 L650 200 L700 350 Z" fill="url(#yellowPrimary)" />
    <path d="M400 400 L650 550 L550 680 Z" fill="url(#yellowPrimary)" />
    <path d="M400 400 L250 680 L150 550 Z" fill="url(#yellowPrimary)" />
    <path d="M400 400 L100 350 L150 200 Z" fill="url(#yellowPrimary)" />
  </g>

  <!-- Geometric Tech Base/Shoulders -->
  <g id="body-base">
    <!-- Outer Cyber Armor (Shoulders) -->
    <path d="M 220 620 L 280 500 L 340 480 L 400 520 L 460 480 L 520 500 L 580 620 L 500 680 L 300 680 Z" fill="#1c1917" stroke="url(#yellowPrimary)" stroke-width="3" />
    
    <!-- Armor Plate Lines -->
    <path d="M 280 500 L 330 650" stroke="#F59E0B" stroke-width="2" opacity="0.6" />
    <path d="M 520 500 L 470 650" stroke="#F59E0B" stroke-width="2" opacity="0.6" />
    
    <!-- Chest Tech Core -->
    <polygon points="400,540 430,580 400,620 370,580" fill="url(#yellowPrimary)" filter="url(#glow)" />
    <line x1="400" y1="620" x2="400" y2="680" stroke="#FFE500" stroke-width="2" />
  </g>

  <!-- Head Structure & Cybernetic Details -->
  <g id="head-group">
    <!-- Head Base Silhouette (Stylized Gorilla / Ape Structure) -->
    <!-- Jaw / Chin Base -->
    <polygon points="320,440 400,490 480,440 460,360 340,360" fill="#171412" stroke="url(#yellowDark)" stroke-width="3" />

    <!-- Brow / Cranium Base -->
    <path d="M 290 300 L 330 220 L 400 190 L 470 220 L 510 300 L 480 340 L 320 340 Z" fill="#26201b" stroke="url(#yellowPrimary)" stroke-width="3" />

    <!-- Cranium Top Lightbulb/Brain Concept Integration (The "Creative" Element) -->
    <!-- Brain / Idea Poly-Mesh (Glowing Yellow) -->
    <g id="creative-brain" filter="url(#highGlow)">
      <!-- Lightbulb / Brain Dome Shell -->
      <path d="M 330 220 Q 400 130 470 220 Z" fill="url(#yellowBright)" opacity="0.85" />
      
      <!-- Filament / Circuit Brain Lines -->
      <path d="M 370 220 L 370 175 L 400 155 L 430 175 L 430 220" fill="none" stroke="#1c1917" stroke-width="3" stroke-linecap="round" />
      <path d="M 400 155 L 400 220" fill="none" stroke="#1c1917" stroke-width="3" />
      
      <!-- Sparks / Innovation Nodes -->
      <circle cx="400" cy="135" r="6" fill="#FFFFFF" />
      <circle cx="360" cy="160" r="4" fill="#FFFFFF" />
      <circle cx="440" cy="160" r="4" fill="#FFFFFF" />
    </g>

    <!-- Powerful Gorilla Brow (Angular, Low-slung, Futuristic) -->
    <path d="M 300 290 L 380 305 L 400 310 L 420 305 L 500 290 L 470 330 L 400 340 L 330 330 Z" fill="url(#yellowDark)" stroke="#FFE500" stroke-width="2" />

    <!-- Cyber Face Plate (Muzzle/Nose Area) -->
    <polygon points="360,350 440,350 450,420 400,450 350,420" fill="#1c1917" stroke="url(#yellowPrimary)" stroke-width="2" />

    <!-- Cyber Tech Nose -->
    <path d="M 385 375 L 400 365 L 415 375 L 405 390 L 395 390 Z" fill="url(#yellowPrimary)" />

    <!-- Glowing Cyber Eyes (VR / Visor or Hexagonal Lenses) -->
    <g id="eyes" filter="url(#glow)">
      <!-- Left Eye -->
      <polygon points="335,315 375,320 370,335 340,330" fill="#FFE500" />
      <circle cx="355" cy="325" r="3" fill="#FFF" />

      <!-- Right Eye -->
      <polygon points="465,315 425,320 430,335 460,330" fill="#FFE500" />
      <circle cx="445" cy="325" r="3" fill="#FFF" />
    </g>

    <!-- Cheek & Jaw Mechanical Accents -->
    <!-- Left Cheek Plate -->
    <path d="M 300 330 L 340 340 L 330 420 L 290 380 Z" fill="#26201b" stroke="#F59E0B" stroke-width="1.5" />
    <!-- Right Cheek Plate -->
    <path d="M 500 330 L 460 340 L 470 420 L 510 380 Z" fill="#26201b" stroke="#F59E0B" stroke-width="1.5" />

    <!-- Earpiece / Headphones (Cybernetic Interface) -->
    <!-- Left Ear Tech -->
    <g transform="translate(265, 300)">
      <rect x="0" y="0" width="30" height="50" rx="8" fill="#1c1917" stroke="url(#yellowPrimary)" stroke-width="2" />
      <circle cx="15" cy="25" r="8" fill="url(#yellowPrimary)" filter="url(#glow)" />
      <path d="M 15 -10 L 15 0" stroke="#FFE500" stroke-width="2" />
    </g>
    <!-- Right Ear Tech -->
    <g transform="translate(505, 300)">
      <rect x="0" y="0" width="30" height="50" rx="8" fill="#1c1917" stroke="url(#yellowPrimary)" stroke-width="2" />
      <circle cx="15" cy="25" r="8" fill="url(#yellowPrimary)" filter="url(#glow)" />
      <path d="M 15 -10 L 15 0" stroke="#FFE500" stroke-width="2" />
    </g>

    <!-- Mouth / Cyber Grille -->
    <path d="M 370 425 L 400 435 L 430 425" fill="none" stroke="#F59E0B" stroke-width="3" stroke-linecap="round" />
    <line x1="385" y1="422" x2="385" y2="430" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="400" y1="425" x2="400" y2="435" stroke="#F59E0B" stroke-width="1.5" />
    <line x1="415" y1="422" x2="415" y2="430" stroke="#F59E0B" stroke-width="1.5" />
  </g>

  <!-- Floating Digital / Creative Nodes (Connecting Ideas) -->
  <g id="tech-data-nodes" stroke="url(#yellowPrimary)" stroke-width="1.5">
    <!-- Left side connections -->
    <polyline points="280,240 220,240 180,200" fill="none" stroke-dasharray="4 4" />
    <circle cx="180" cy="200" r="4" fill="#FFE500" filter="url(#glow)" />
    
    <polyline points="290,380 210,380 170,420" fill="none" />
    <circle cx="170" cy="420" r="5" fill="#D97706" />
    <circle cx="170" cy="420" r="2" fill="#FFF" />

    <!-- Right side connections -->
    <polyline points="520,240 580,240 620,200" fill="none" stroke-dasharray="4 4" />
    <circle cx="620" cy="200" r="4" fill="#FFE500" filter="url(#glow)" />

    <polyline points="510,380 590,380 630,420" fill="none" />
    <circle cx="630" cy="420" r="5" fill="#D97706" />
    <circle cx="630" cy="420" r="2" fill="#FFF" />
    
    <!-- Top Brain Idea Sparks -->
    <line x1="400" y1="130" x2="400" y2="90" stroke="#FFE500" stroke-width="2" stroke-dasharray="3 3" filter="url(#glow)" />
    <circle cx="400" cy="85" r="6" fill="#FFE500" filter="url(#highGlow)" />

    <line x1="440" y1="140" x2="470" y2="100" stroke="#FFE500" stroke-width="2" filter="url(#glow)" />
    <circle cx="475" cy="95" r="4" fill="#FBBF24" />

    <line x1="360" y1="140" x2="330" y2="100" stroke="#FFE500" stroke-width="2" filter="url(#glow)" />
    <circle cx="325" cy="95" r="4" fill="#FBBF24" />
  </g>

  <!-- Foreground Hexagon Overlay / Cyber Details -->
  <g opacity="0.4" stroke="#FFE500" stroke-width="1" fill="none">
    <polygon points="400,60 420,70 420,90 400,100 380,90 380,70" />
    <polygon points="630,480 645,490 645,505 630,515 615,505 615,490" />
    <polygon points="170,480 185,490 185,505 170,515 155,505 155,490" />
  </g>
</svg>